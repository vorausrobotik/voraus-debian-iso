name: Build

on: [workflow_call]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Install tox
        run: python -m pip install --upgrade tox==4.23.2 tox-uv~=1.16.0

      - name: Build python app
        run: tox run -e build

      - name: Require non dirty git workspace
        run: |
          CHANGES=$(git status --porcelain)
          if [[ -n "$CHANGES" ]]; then
            echo "❌ Workspace is dirty. The following files have been modified:"
            echo "$CHANGES"
            exit 1
          else
            echo "✅ Workspace is clean."
          fi

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    env:
      COLUMNS: 160
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        # apt-get update is mandatory: the package lists of the runner image are stale, so apt requests .deb
        # versions that have already been removed from the mirrors, which fails with "404 Not Found".
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools xorriso

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install .

      - name: Build ISO
        run: voraus-debian-iso build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: output/*.iso
